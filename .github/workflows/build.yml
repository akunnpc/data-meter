name: Build DataMeter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # gradlew & gradle-wrapper.jar tidak ada di repo, jadi pasang Gradle
      # sesuai gradle-wrapper.properties dan panggil `gradle` langsung.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # debug.keystore ada di .gitignore, tapi dipakai signingConfig debug.
      - name: Generate debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: datameter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Test dipisah & ga ngeblok APK kalau ada test yang gagal.
      - name: Run Unit Tests
        continue-on-error: true
        run: gradle testDebugUnitTest --continue --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datameter-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          
