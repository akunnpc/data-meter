name: Build & Test DataMeter

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build with Gradle
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Unzip project if source is zipped
      run: |
        shopt -s nullglob
        zips=(*.zip)
        if [ ${#zips[@]} -gt 0 ]; then
          echo "Found zip file(s), extracting..."
          for z in "${zips[@]}"; do
            unzip -o "$z" -d extracted_project
          done
          echo "Contents after extraction:"
          find extracted_project -maxdepth 3
        else
          echo "No zip found, assuming source is already extracted."
        fi

    - name: Move extracted project to root (if needed)
      run: |
        if [ -d extracted_project ]; then
          inner_dirs=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | wc -l)
          inner_files=$(find extracted_project -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$inner_dirs" -eq 1 ] && [ "$inner_files" -eq 0 ]; then
            SUBDIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d)
            cp -r "$SUBDIR"/. .
          else
            cp -r extracted_project/. .
          fi
          rm -rf extracted_project
          echo "Root after move:"
          ls -la
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install latest SDK platform & build-tools
      run: |
        sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
        # compileSdk project ini 36.1 -> coba pasang juga (kalau ga ada, AGP download sendiri)
        sdkmanager --install "platforms;android-36.1" || true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Generate Gradle wrapper if missing
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew tidak ditemukan, generate wrapper otomatis..."
          gradle wrapper --gradle-version 9.3.1
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Create .env from example (if missing)
      run: |
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        fi

    - name: Generate debug keystore
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey -keypass android \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
        fi

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: datameter-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
        if-no-files-found: error

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/
        retention-days: 30
        if-no-files-found: ignore

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project if source is zipped
      run: |
        shopt -s nullglob
        zips=(*.zip)
        if [ ${#zips[@]} -gt 0 ]; then
          echo "Found zip file(s), extracting..."
          for z in "${zips[@]}"; do
            unzip -o "$z" -d extracted_project
          done
          echo "Contents after extraction:"
          find extracted_project -maxdepth 3
        else
          echo "No zip found, assuming source is already extracted."
        fi

    - name: Move extracted project to root (if needed)
      run: |
        if [ -d extracted_project ]; then
          inner_dirs=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | wc -l)
          inner_files=$(find extracted_project -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$inner_dirs" -eq 1 ] && [ "$inner_files" -eq 0 ]; then
            SUBDIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d)
            cp -r "$SUBDIR"/. .
          else
            cp -r extracted_project/. .
          fi
          rm -rf extracted_project
          echo "Root after move:"
          ls -la
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install latest SDK platform & build-tools
      run: |
        sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
        sdkmanager --install "platforms;android-36.1" || true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Generate Gradle wrapper if missing
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew tidak ditemukan, generate wrapper otomatis..."
          gradle wrapper --gradle-version 9.3.1
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Create .env from example (if missing)
      run: |
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        fi

    - name: Generate debug keystore
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey -keypass android \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
        fi

    - name: Run Android Lint
      run: ./gradlew lintDebug --stacktrace

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html
        retention-days: 30
        if-no-files-found: ignore
        
